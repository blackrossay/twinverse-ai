[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "twinverse"
version = "0.1.0"
description = "TWINVERSE AI backend: Parallel Reality Engine API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "openai>=1.0",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]
# Talking-verdict avatars: local open-source voice + video. The two git
# packages (MeloTTS, OpenVoice) install separately per docs/AVATAR.md.
avatar = [
  "torch>=2.2",
  "imageio-ffmpeg>=0.5",
  "pillow>=10.0",
  "numpy>=1.0",
]

[tool.hatch.build]
packages = ["twinverse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]  # B008: Depends()/File() in defaults is the FastAPI idiom

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]  # package re-exports
