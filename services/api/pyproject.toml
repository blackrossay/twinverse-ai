[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "twinverse"
version = "0.1.0"
description = "TWINVERSE AI backend: Parallel Reality Engine API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "openai>=1.0",
  "uvicorn>=0.30",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

[tool.hatch.build]
packages = ["twinverse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
